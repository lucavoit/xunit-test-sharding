# Builds xunit-shard and dogfoods it on the Reqnroll sample: the sample stands in for a test project
# built by another pipeline (see examples/tests-from-another-pipeline.yml).
trigger:
  branches:
    include:
    - main

parameters:
- name: agentPool
  displayName: Agent pool (self-hosted Windows)
  type: string
  default: Default
- name: totalShards
  displayName: Number of shards
  type: number
  default: 3

variables:
  buildConfiguration: Release

stages:
- stage: Build
  jobs:
  - job: Build
    pool:
      name: ${{ parameters.agentPool }}
    steps:
    - task: UseDotNet@2
      displayName: Install .NET SDK
      inputs:
        packageType: sdk
        useGlobalJson: true

    - script: dotnet build XunitTestSharding.slnx --configuration $(buildConfiguration)
      displayName: Build

    - script: dotnet test --project tests/XunitTestSharding.Tests --configuration $(buildConfiguration) --no-build
      displayName: Test xunit-shard

    # Self-contained, so the test agents do not need a .NET runtime to run the tool
    - script: >-
        dotnet publish src/XunitTestSharding
        --configuration $(buildConfiguration)
        --runtime win-x64
        --self-contained
        --output $(Build.ArtifactStagingDirectory)/xunit-shard
      displayName: Publish xunit-shard

    - publish: $(Build.ArtifactStagingDirectory)/xunit-shard
      artifact: xunit-shard
      displayName: Upload xunit-shard

    - publish: samples/Reqnroll.Sample/bin/$(buildConfiguration)/net10.0
      artifact: sample-tests
      displayName: Upload sample tests

- stage: Test
  dependsOn: Build
  jobs:
  - template: templates/xunit-shard-job.yml
    parameters:
      displayName: Reqnroll sample
      pool:
        name: ${{ parameters.agentPool }}
      totalShards: ${{ parameters.totalShards }}
      testRunTitle: Reqnroll sample
      prepareSteps:
      - checkout: none
      # The sample is framework-dependent: it needs the .NET runtime on the agent
      - task: UseDotNet@2
        displayName: Install .NET runtime
        inputs:
          packageType: runtime
          version: 10.0.x
      - download: current
        artifact: xunit-shard
        displayName: Download xunit-shard
      - download: current
        artifact: sample-tests
        displayName: Download sample tests
      toolPath: $(Pipeline.Workspace)\xunit-shard\xunit-shard.exe
      testAssembly: $(Pipeline.Workspace)\sample-tests\Reqnroll.Sample.exe
