# Runs the tests of an xUnit.net v3 test assembly in N parallel jobs, each running one shard, and
# publishes the JUnit results of every shard.
#
# The agents of the job must be able to run the test assembly (.NET runtime) and xunit-shard
# (published self-contained by azure-pipelines.yml, so it does not need a runtime).
parameters:
- name: jobName
  type: string
  default: ShardedTests
- name: displayName
  type: string
  default: Sharded tests
- name: dependsOn
  type: object
  default: []
- name: pool
  type: object
  default:
    name: Default
- name: totalShards
  type: number
  default: 4
# Steps that make the tool and the test assembly available on the agent, such as 'download' steps
- name: prepareSteps
  type: stepList
  default: []
# Path of xunit-shard.exe on the agent
- name: toolPath
  type: string
# Path of the test assembly (.exe) on the agent
- name: testAssembly
  type: string
# Command line of the test assembly used by junitSwitch and testArguments:
# - xunit: xUnit.net command line (-junit, -trait-, ...)
# - mtp:   Microsoft.Testing.Platform command line (--report-junit, --filter-not-trait, ...), for test projects
#          built with <UseMicrosoftTestingPlatformRunner>true</UseMicrosoftTestingPlatformRunner>
- name: runner
  type: string
  default: xunit
  values:
  - xunit
  - mtp
# Switch that enables the JUnit report. Empty: the xUnit.net v3 4.x switch of the runner.
#   xunit: -junit (3.x), -result-junit (4.x)
#   mtp:   --report-junit (3.x), --report-xunit-junit (4.x); '<switch>-filename' sets the file name
- name: junitSwitch
  type: string
  default: ''
# Additional arguments for the test assembly (filters, -maxThreads, ...), used to list and to run the tests
- name: testArguments
  type: string
  default: ''
- name: testRunTitle
  type: string
  default: Tests
- name: timeoutInMinutes
  type: number
  default: 60

jobs:
- job: ${{ parameters.jobName }}
  displayName: ${{ parameters.displayName }}
  dependsOn: ${{ parameters.dependsOn }}
  pool: ${{ parameters.pool }}
  timeoutInMinutes: ${{ parameters.timeoutInMinutes }}
  strategy:
    # Sets System.JobPositionInPhase (1..N) and System.TotalJobsInPhase (N) for each job
    parallel: ${{ parameters.totalShards }}
  steps:
  - ${{ each step in parameters.prepareSteps }}:
    - ${{ step }}

  # cmd rather than PowerShell: Windows PowerShell drops the '--' separator when calling an executable
  - ${{ if eq(parameters.runner, 'xunit') }}:
    - script: >-
        "${{ parameters.toolPath }}"
        --runner xunit
        --shard-index $(System.JobPositionInPhase)
        --total-shards $(System.TotalJobsInPhase)
        "${{ parameters.testAssembly }}"
        --
        ${{ coalesce(parameters.junitSwitch, '-result-junit') }} "$(Common.TestResultsDirectory)\xunit-shard-$(System.JobPositionInPhase).xml"
        ${{ parameters.testArguments }}
      displayName: Run shard $(System.JobPositionInPhase)/$(System.TotalJobsInPhase)

  - ${{ if eq(parameters.runner, 'mtp') }}:
    - script: >-
        "${{ parameters.toolPath }}"
        --runner mtp
        --shard-index $(System.JobPositionInPhase)
        --total-shards $(System.TotalJobsInPhase)
        "${{ parameters.testAssembly }}"
        --
        ${{ coalesce(parameters.junitSwitch, '--report-xunit-junit') }}
        ${{ coalesce(parameters.junitSwitch, '--report-xunit-junit') }}-filename xunit-shard-$(System.JobPositionInPhase).xml
        --results-directory "$(Common.TestResultsDirectory)"
        ${{ parameters.testArguments }}
      displayName: Run shard $(System.JobPositionInPhase)/$(System.TotalJobsInPhase)

  - task: PublishTestResults@2
    displayName: Publish test results
    condition: succeededOrFailed()
    inputs:
      testResultsFormat: JUnit
      testResultsFiles: xunit-shard-*.xml
      searchFolder: $(Common.TestResultsDirectory)
      testRunTitle: ${{ parameters.testRunTitle }} (shard $(System.JobPositionInPhase)/$(System.TotalJobsInPhase))
